version: '3.8'

services:
  # ── Database ──────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: srlux-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: srlux_premium
      POSTGRES_USER: srlux
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U srlux"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - srlux_network

  # ── Cache ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: srlux-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - srlux_network

  # ── Backend API ───────────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: srlux-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://srlux:${DB_PASSWORD}@postgres:5432/srlux_premium
      REDIS_URL: redis://redis:6379
      DOLIBARR_API_URL: ${DOLIBARR_API_URL:-https://bollente.uz/api/index.php/}
      DOLIBARR_API_KEY: ${DOLIBARR_API_KEY:?DOLIBARR_API_KEY is required}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?ADMIN_API_KEY is required}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      USD_TO_UZS_RATE: ${USD_TO_UZS_RATE:-12650}
      DOLIBARR_DEFAULT_CURRENCY: ${DOLIBARR_DEFAULT_CURRENCY:-USD}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - srlux_network

  # ── Frontend ──────────────────────────────────────────────────────────────────
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: srlux-web
    restart: unless-stopped
    environment:
      VITE_API_URL: ""
    networks:
      - srlux_network

  # ── Nginx reverse proxy ───────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: srlux-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./static:/var/www/static:ro
    depends_on:
      - api
      - web
    networks:
      - srlux_network

volumes:
  postgres_data:

networks:
  srlux_network:
    driver: bridge
