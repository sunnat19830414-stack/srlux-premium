worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=admin_limit:1m rate=3r/m;

    # Request body size limit
    client_max_body_size 10m;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    # Docker internal DNS — resolves hostnames at request time, not startup
    resolver 127.0.0.11 valid=10s ipv6=off;

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name srlux.uz www.srlux.uz;
        return 301 https://$host$request_uri;
    }

    # HTTPS
    server {
        listen 443 ssl;
        server_name srlux.uz www.srlux.uz;

        ssl_certificate     /etc/letsencrypt/live/srlux.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/srlux.uz/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://bollente.uz; connect-src 'self' https://bollente.uz; frame-ancestors 'none'; object-src 'none'; base-uri 'self';" always;

        # Admin API — very strict rate limiting (3 req/min per IP)
        location /api/admin/ {
            limit_req zone=admin_limit burst=2 nodelay;
            limit_req_status 429;
            set $backend http://api:8000;
            proxy_pass         $backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # API — rate limited, uses variable so hostname resolves at request time
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;
            set $backend http://api:8000;
            proxy_pass         $backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        location /health {
            set $backend http://api:8000;
            proxy_pass $backend;
        }

        # Product photos — served from local static directory
        location /static/ {
            alias /var/www/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin "*";
            access_log off;
        }

        # Frontend SPA
        location / {
            limit_req zone=general burst=50 nodelay;
            set $frontend http://web:3000;
            proxy_pass         $frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
        }
    }
}
