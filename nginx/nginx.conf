worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=admin_limit:1m rate=30r/m;

    # Request body size limit
    client_max_body_size 10m;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    # Docker internal DNS — resolves hostnames at request time, not startup
    resolver 127.0.0.11 valid=10s ipv6=off;

    # BusBot Mini App (jomiy) — HTTP: acme-challenge + redirect
    server {
        listen 80;
        server_name jomiy-89-39-94-206.sslip.io;
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # BusBot Mini App — HTTP: acme-challenge + redirect
    server {
        listen 80;
        server_name 89-39-94-206.sslip.io;
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name srlux.uz www.srlux.uz;
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS
    server {
        listen 443 ssl;
        server_name srlux.uz www.srlux.uz;

        ssl_certificate     /etc/letsencrypt/live/srlux.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/srlux.uz/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://connect.facebook.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://bollente.uz https://www.googletagmanager.com https://www.google-analytics.com https://analytics.google.com https://www.facebook.com; connect-src 'self' https://bollente.uz https://www.googletagmanager.com https://www.google-analytics.com https://region1.google-analytics.com https://analytics.google.com https://connect.facebook.net https://www.facebook.com; frame-src https://www.googletagmanager.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self';" always;

        # Admin API — very strict rate limiting (3 req/min per IP)
        location /api/admin/ {
            limit_req zone=admin_limit burst=10 nodelay;
            limit_req_status 429;
            set $backend http://api:8000;
            proxy_pass         $backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # API — rate limited, uses variable so hostname resolves at request time
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;
            set $backend http://api:8000;
            proxy_pass         $backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        location /health {
            set $backend http://api:8000;
            proxy_pass $backend;
        }

        # Dynamic sitemap.xml — real product URLs from the live DB, generated
        # by the API, not the static SPA (which would just fall back to index.html)
        location = /sitemap.xml {
            set $backend http://api:8000;
            proxy_pass $backend/sitemap.xml;
        }

        # Google Merchant Center product feed — same reasoning as sitemap.xml
        # above: generated by the API from live product data, not the SPA.
        location = /products.xml {
            set $backend http://api:8000;
            proxy_pass $backend/products.xml;
        }

        # Yandex Market/Direct YML feed — same reasoning as products.xml above.
        location = /market.yml {
            set $backend http://api:8000;
            proxy_pass $backend/market.yml;
        }

        # Product photos — served from local static directory
        location /static/ {
            alias /var/www/static/;
            expires 1y;  # uuid-named files, never reused -- safe to cache long, matches /assets/ policy
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin "*";
            access_log off;
        }

        # Vite build output — filenames are content-hashed (index-<hash>.js),
        # so a new deploy always gets a new URL. Safe to cache "forever";
        # PSI flagged the previous no-cache-header default as a savings
        # opportunity (repeat visits re-download JS/CSS/fonts every time).
        location /assets/ {
            set $frontend http://web:3000;
            proxy_pass         $frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # Static SEO snapshots — real per-page <title>/<meta>/JSON-LD for
        # crawlers that don't execute JS, generated by erp_sync_dolibarr.py
        # every 30 min (see generate_model_snapshots/generate_static_snapshots
        # there). Falls back to the plain SPA shell (@spa below) if a
        # snapshot hasn't been generated yet for a given code/page — the app
        # still works exactly as before in that case, just without the
        # pre-rendered meta tags. React uses createRoot (not hydrateRoot), so
        # it always wipes and re-renders `#root` from scratch — no hydration-
        # mismatch risk from serving this static markup first.
        location = / {
            root /var/www/static;
            try_files /uploads/static-snapshots/home.html @spa;
        }
        location = /about {
            root /var/www/static;
            try_files /uploads/static-snapshots/about.html @spa;
        }
        location = /contacts {
            root /var/www/static;
            try_files /uploads/static-snapshots/contacts.html @spa;
        }
        location = /delivery {
            root /var/www/static;
            try_files /uploads/static-snapshots/delivery.html @spa;
        }
        location = /returns {
            root /var/www/static;
            try_files /uploads/static-snapshots/returns.html @spa;
        }
        location ~ ^/model/([A-Za-z0-9._-]+)$ {
            root /var/www/static;
            try_files /uploads/model-snapshots/$1.html @spa;
        }
        # Query-string route (?cat=<id>) — nginx `location` matches on path
        # only, so unlike /model/<code> this can't use a regex capture; the
        # category id comes from $arg_cat instead. Empty/missing $arg_cat
        # (bare /catalog, or an id with no snapshot yet) safely falls
        # through to @spa via try_files, same as the blocks above.
        location = /catalog {
            root /var/www/static;
            try_files /uploads/category-snapshots/$arg_cat.html @spa;
        }

        # Frontend SPA
        location / {
            limit_req zone=general burst=50 nodelay;
            set $frontend http://web:3000;
            proxy_pass         $frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
        }

        location @spa {
            limit_req zone=general burst=50 nodelay;
            set $frontend http://web:3000;
            proxy_pass         $frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
        }
    }

    # BusBot Mini App (jomiy) — HTTPS
    server {
        listen 443 ssl;
        server_name jomiy-89-39-94-206.sslip.io;

        ssl_certificate     /etc/letsencrypt/live/jomiy-89-39-94-206.sslip.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/jomiy-89-39-94-206.sslip.io/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            limit_req zone=general burst=50 nodelay;
            proxy_pass         http://172.18.0.1:8002;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }

    # BusBot Mini App — HTTPS
    server {
        listen 443 ssl;
        server_name 89-39-94-206.sslip.io;

        ssl_certificate     /etc/letsencrypt/live/89-39-94-206.sslip.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/89-39-94-206.sslip.io/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            limit_req zone=general burst=50 nodelay;
            proxy_pass         http://172.18.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }

}
